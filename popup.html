<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="stylesheet" href="css/style.css" />
		<title>Help Helpscout</title>
	</head>
	<body>
		<div class="container-fluid">
			<div class="d-grid d-md-flex justify-content-md-center">
				<h1>Help my Helpscout</h1>
			</div>

			<div class="d-grid gap-2">
				<button type="button" class="btn btn-primary" id="test-button">Test</button>
				<button type="button" class="btn btn-primary" id="no-button">No</button>
			</div>

			<div class="form-check d-grid d-md-flex justify-content-md-center">
				<input class="form-check-input" type="checkbox" value="" id="checkDefault" />
				<label class="form-check-label" for="checkDefault">Debug Mode</label>
			</div>
		</div>
		<script src="popup.js"></script>
	</body>
</html>
