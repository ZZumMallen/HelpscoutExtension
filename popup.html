<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="css/style.css" />
		<title>Help Helpscout</title>
	</head>
	<body>
		<div class="container-fluid">
			<div class="d-grid d-md-flex justify-content-md-center">
				<h1>Help my Helpscout</h1>
			</div>

			<div class="d-grid gap-2">
				<button type="button" class="btn btn-primary" id="test-button">Test</button>
				<button type="button" class="btn btn-primary" id="no-button">No</button>
			</div>

			<div class="form-check d-grid d-md-flex justify-content-md-center">
				<input class="form-check-input" type="checkbox" value="" id="checkDefault" />
				<label class="form-check-label" for="checkDefault">Debug Mode</label>
			</div>
		</div>
		<script src="popup.js"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"
		></script>
	</body>
</html>
