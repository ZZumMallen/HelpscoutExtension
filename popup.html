<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="css/style.css" />
		<title>CSR Tools</title>
	</head>
	<body>
		<div class="container-fluid">
			<!-- Each switch's data-setting is the key saved in chrome.storage.local.
			To add a setting: add a switch here, a default in settings.js,
			and a rule in content.js. -->
			<h1>Talkdesk</h1>
			<label for="purple-header">Purple Header</label>
			<input class="switch" id="purple-header" type="checkbox" data-setting="purpleHeader">

			<h1>Helpscout</h1>
			<label for="hs-sidebar">Hide Sidebar</label>
			<input class="switch" id="hs-sidebar" type="checkbox" data-setting="hsSidebar">
		</div>
		<script src="settings.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
